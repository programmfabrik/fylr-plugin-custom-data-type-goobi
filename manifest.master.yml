plugin:
  name: custom-data-type-goobi
  version: 2.0
  url: https://github.com/programmfabrik/fylr-plugin-custom-data-type-goobi
  displayname:
    de-DE: Goobi-Verknüpfung
    en-US: Goobi-Referencing
  info:
    de-DE: |
      Ergänzt fylr um einen Feldtyp, mit dem sich Datensätze mit Vorgängen aus einem [Goobi-Workflow](https://www.intranda.com/digiverso/goobi/) (intranda) verknüpfen lassen. Redakteure durchsuchen die Goobi-Prozessdatenbank direkt im Maskenfeld und speichern einen Verweis auf den passenden Vorgang, sodass Digitalisierungs-Workflows mit den fylr-Datensätzen verbunden bleiben. Durchsuchbare Goobi-Projekte, Metadatenfelder und der API-Endpunkt sind konfigurierbar.
    en-US: |
      Adds a custom data type for linking records to processes in a [Goobi workflow](https://www.intranda.com/digiverso/goobi/) production system (intranda). Editors search the Goobi process database from a mask field and store a link to the matching process, keeping digitization workflows connected to your fylr records. The searchable Goobi projects and metadata fields, plus the API endpoint, are configurable.
  l10n: l10n/customDataTypeGoobi.csv
  webfrontend:
    url: customDataTypeGoobi.js
    css: customDataTypeGoobi.css
    dependencies:
      - commons-library

base_url_prefix: "webfrontend"

custom_types:
  goobi:
    mapping:
      conceptName:
        type: text
      conceptURI:
        type: text
      facetTerm:
        type: text_l10n
    config:
      mask:
        - name: editor_display
          parameters:
            value:
              type: select
              options: ["default", "condensed"]

    update:
      plugin_user:
        reference: system:root
      exec:
        service: "node"
        commands:
          - prog: "node"
            stdin:
              type: body
            stdout:
              type: body
            args:
              - type: "value"
                value: "%_exec.pluginDir%/updater/GoobiUpdater.js"
              - type: "value"
                value: "%info.json%"
      timeout: 60
      batch_size: 1
      expires_days: 1

base_config:
  - name: update_goobi
    group: update_custom_data_type
    parameters:
      restrict_time:
        type: bool
        default: false
        position: 0
      from_time:
        type: int
        default: 19
        min: 0
        max: 23
        position: 1
      to_time:
        type: int
        default: 4
        min: 0
        max: 23
        position: 2
      custom_expires_days:
        type: int
        min: 1
        default: 1
        position: 3
  - name: goobi_api
    group: api_custom_data_type
    parameters:
      goobi_api_url:
        type: text
        position: 0
      goobi_endpoint_token:
        type: text
        position: 1
      projects:
        type: text
        position: 2
      searchfields:
        type: text
        position: 3
      safeAsConceptName:
        type: text
        position: 4
      safeAsConceptURI:
        type: text
        position: 5
